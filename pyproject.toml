[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashspec-asm-kernel"
version = "0.1.0"
description = "AVX2 assembly kernel for the residual distribution in speculative decoding (optional backend for flashspec)"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Min Htet Myet (Mattral)" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

keywords = ["speculative-decoding", "avx2", "assembly", "performance", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Assembly",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Mattral/flashspec-asm"
Repository = "https://github.com/Mattral/flashspec-asm"

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "torch"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flashspec_asm_kernel*"]

[tool.setuptools.package-data]
"flashspec_asm_kernel" = ["*.so", "*.pyd"]

