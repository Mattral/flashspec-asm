name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  correctness:
    name: Correctness suite (Phase 1+)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install flashspec hypothesis pytest numpy
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run correctness suite (reference)
        run: pytest tests/test_correctness.py -v --tb=short

  build-asm:
    name: Assemble + link + correctness (Phase 3+)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NASM and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm

      - name: Install Python dependencies
        run: |
          pip install flashspec hypothesis pytest numpy
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Build shared object
        run: make

      - name: Run correctness suite (reference + ASM backends)
        run: pytest tests/ -v --tb=short

  benchmark:
    name: Benchmark (Phase 5+)
    runs-on: ubuntu-latest
    # Benchmark regressions do NOT fail CI — results uploaded as artifacts.
    # Requires a non-containerised runner for perf stat; perf_counter_ns used here.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NASM and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm

      - name: Install Python dependencies
        run: |
          pip install flashspec numpy
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Build shared object
        run: make

      - name: Run benchmark harness
        run: python bench/bench_harness.py --output bench/results/

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench/results/

  wheel:
    name: Build platform wheel (Linux x86_64)
    runs-on: ubuntu-latest
    # Only run on pushes to main (not PRs) to avoid burning CI minutes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NASM and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm

      - name: Install Python build dependencies
        run: pip install build wheel auditwheel

      - name: Build .so and wheel
        run: python build_wheel.py

      - name: Audit wheel (check manylinux compatibility)
        run: |
          pip install auditwheel
          auditwheel show dist/*.whl

      - name: Install and smoke-test wheel
        run: |
          pip install dist/*.whl
          python -c "
          import flashspec_asm_kernel as asm
          print('ABI version:', asm.abi_version())
          print('AVX2 supported:', asm.cpu_supports_avx2())
          assert asm.abi_version() == 1
          print('Smoke test: PASSED')
          "

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashspec-asm-kernel-wheel
          path: dist/*.whl
