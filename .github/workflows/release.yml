# Release workflow: manual-only (workflow_dispatch).
#
# It rebuilds and re-tests the wheel via wheel.yml, and the publish job
# `needs` that, so nothing can be uploaded unless the clean-venv install
# tests pass on the exact files being uploaded.
#
# Uploads use PyPI trusted publishing (OIDC); no API token is stored. The
# PyPI project trusts this repo, workflow `release.yml`, environment `pypi`.
# The `testpypi` target additionally needs the same trusted publisher on
# test.pypi.org. Tip: add a required reviewer to the `pypi` environment in
# the repo settings so every upload needs a click.
#
# Only the wheel is uploaded. An sdist (python -m build --sdist) also works,
# since setup.py runs `make` for source builds, but is not published.
name: Release

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Upload target"
        type: choice
        options: [testpypi, pypi]
        default: pypi

permissions:
  contents: read

jobs:
  wheel:
    uses: ./.github/workflows/wheel.yml

  publish:
    name: Publish to ${{ inputs.repository }}
    needs: wheel
    runs-on: ubuntu-latest
    environment: ${{ inputs.repository }}
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC), no API token stored
    steps:
      - name: Download tested wheel
        uses: actions/download-artifact@v4
        with:
          name: flashspec-asm-kernel-wheel
          path: dist

      - name: Upload
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
